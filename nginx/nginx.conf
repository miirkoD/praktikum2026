server {
    listen 80;
    
    resolver 127.0.0.11 valid=30s;
    
    location / {
        set $frontend frontend:80;
        proxy_pass http://$frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        set $backend backend:8080;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}