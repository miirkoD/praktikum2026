services:

  db:
    image: postgres:15-alpine
    container_name: videoteka-db
    environment:
      POSTGRES_DB: videoteka
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Mirko123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./Videoteka-backend
    container_name: videoteka-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/videoteka
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Mirko123
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./Videoteka-frontend
    container_name: videoteka-frontend
    networks:
      - internal
    depends_on:
      - backend

  reverse-proxy:
    build: ./nginx
    container_name: videoteka-proxy
    ports:
      - "80:80"
    networks:
      - public
      - internal
    depends_on:
      - frontend
      - backend

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  postgres-data: 